# Reference config for the resume match Worker. Deployed manually (not by CI).
# Do not put MATCH_TRUSTED_SECRET here. Set it with `npx wrangler secret put MATCH_TRUSTED_SECRET`.
# Optional TURNSTILE_SECRET_KEY (same widget secret as Vercel). Leave it unset until the widget exists.
# Untrusted callers must send turnstile_token once it is set. The Next.js app is trusted and skips it.
name = "publicjobs-resume-match"
main = "worker.js"
compatibility_date = "2026-09-01"
account_id = "277a2bbf146ed0358bc4b0ad66db8629"
workers_dev = true

[observability]
enabled = true

[ai]
binding = "AI"

# Optional vars. Leave both unset in production.
# MATCH_MONTHLY_CAP_USD = "10"   # estimated AI spend cap for the UTC month. Default in code is 10.
# MATCH_CANDIDATES = "500"       # jobs the SQL pass sends to the model. Default in code is 500.

[[kv_namespaces]]
binding = "USAGE"          # preview_html page + optional config_model / config_batch overrides
id = "fdff87dd6046498092ba6d5c905aa521"

[[d1_databases]]
binding = "DB"             # usage counters: usage(k TEXT PRIMARY KEY, n INTEGER)
database_name = "publicjobs-resume-match-usage"
database_id = "62a183d1-65f0-4efd-b5af-4766dc4773be"

[[services]]
binding = "SIGNUP"         # existing live signup Worker, called (not modified) to add the contact + welcome email
service = "ontario-public-jobs-signup"
